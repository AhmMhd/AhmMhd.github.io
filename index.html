<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abdul Hakeem - Games</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 3rem 1.25rem 5rem;
    background: #0e0e34; color: #e2dfff;
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 40rem; margin: 0 auto; }
  h1 { color: #ffe330; font-size: 2rem; margin: 0 0 .25rem; letter-spacing: -.02em; }
  .sub { color: #cec6aa; margin: 0 0 3rem; }
  .app {
    display: block; text-decoration: none; color: inherit;
    background: #17173d; border: 1px solid #313158;
    border-radius: 1.25rem; padding: 1.5rem;
    box-shadow: 0 6px 0 0 rgba(0,0,0,.34);
  }
  .app h2 { color: #ffe330; margin: 0 0 .35rem; font-size: 1.35rem; }
  .app p { margin: 0 0 1rem; color: #cec6aa; }
  .tag {
    display: inline-block; background: #c20299; color: #ffe0ef;
    font-size: .75rem; font-weight: 700; letter-spacing: .05em;
    padding: .25rem .7rem; border-radius: 999px; margin-bottom: .75rem;
  }
  .links { margin-top: .75rem; font-size: .9rem; }
  a.small { color: #ffaedd; }
  footer { color: #cec6aa; font-size: .875rem; margin-top: 3rem; }
</style>
</head>
<body>
<main>

<h1>Abdul Hakeem</h1>
<p class="sub">Games for Android.</p>

<div class="app">
  <span class="tag">ANDROID</span>
  <h2>Trail Bloom</h2>
  <p>A territory-capture puzzle. Draw into open space, close a loop, and claim what you
  enclosed - every level you clear uncovers the picture hiding underneath the board.</p>
  <div class="links">
    <a class="small" href="https://ahmmhd.github.io/trail-bloom-privacy/">Privacy policy</a>
  </div>
</div>

<footer>
  Contact: <a class="small" href="mailto:ahm.mhd78@gmail.com">ahm.mhd78@gmail.com</a>
</footer>

</main>
</body>
</html>
